<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarMaps</title>
    <script>
      // Polyfill for __publicField which is sometimes injected by transpilers
      // but not defined in the global scope.
      (function() {
        var polyfill = function(obj, key, value) {
          if (typeof obj === 'undefined' || obj === null) return value;
          try {
            Object.defineProperty(obj, key, {
              value: value,
              enumerable: true,
              configurable: true,
              writable: true,
            });
          } catch (e) {
            obj[key] = value;
          }
          return value;
        };
        window.__publicField = polyfill;
        globalThis.__publicField = polyfill;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
