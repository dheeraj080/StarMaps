services:
  # The Java/Spring Boot Backend
  backend:
    build: ./server # Assuming your Java code is here
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/starmaps
    depends_on:
      db:
        condition: service_healthy

  # The React Frontend
  frontend:
    build: 
      context: ./client
      args:
        - VITE_API_BASE=/api
    ports:
      - "80:80"
    depends_on:
      - backend

  # Database (Example: PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=starmaps
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d starmaps"]
      interval: 5s
      timeout: 5s
      retries: 5