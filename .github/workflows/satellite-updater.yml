name: Update Satellite Data

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: 

jobs:
  update-tle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5  # Fix: Use setup-python instead of setup-node
        with:
          python-version: '3.11'
          cache: 'pip' # Optional: Speeds up future runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update Job
        env:
          # Match the variable name your code expects (DB_URL or DATABASE_URL)
          DATABASE_URL: ${{ secrets.DATABASE_URL }} 
        run: python -m app.jobs.worker